<svg width="600" height="176" viewBox="0 0 600 176" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Startup Weekend and Techstars</title>
  <desc id="desc">Startup Weekend logo style with Powered by Google for Entrepreneurs and Techstars wordmark.</desc>
  <rect width="600" height="176" fill="white"/>

  <!-- Startup Weekend flask mark -->
  <g transform="translate(70 46)">
    <circle cx="14" cy="4" r="5" fill="#10A957"/>
    <circle cx="25" cy="13" r="4" fill="#10A957"/>
    <circle cx="10" cy="20" r="3" fill="#10A957"/>
    <path d="M4 27H36L29 51V84H11V51L4 27Z" stroke="#10A957" stroke-width="4" stroke-linejoin="round"/>
    <path d="M11 50C16 45 22 60 29 54" stroke="#10A957" stroke-width="3" stroke-linecap="round"/>
    <circle cx="17" cy="64" r="2.5" fill="#10A957"/>
    <circle cx="25" cy="75" r="2.2" fill="#10A957"/>
    <circle cx="17" cy="80" r="1.8" fill="#10A957"/>
    <path d="M12 84C16 66 25 66 29 84" stroke="#10A957" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- startupweekend wordmark -->
  <text x="118" y="101" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#24313B" letter-spacing="-2">startupweekend</text>
  <text x="384" y="82" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" fill="#24313B">TM</text>
  <text x="222" y="119" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#24313B">Powered by Google for Entrepreneurs</text>

  <!-- divider -->
  <line x1="406" y1="58" x2="406" y2="129" stroke="#B9C2C9" stroke-width="1.3"/>

  <!-- Techstars mountain/star approximation -->
  <g transform="translate(426 48)">
    <path d="M39 21L64 49L85 22L111 61H4L39 21Z" fill="#6F8794"/>
    <path d="M64 49L85 22L111 61H72L64 49Z" fill="#486A78"/>
    <path d="M64 0L70 20H91L74 32L81 52L64 40L47 52L54 32L37 20H58L64 0Z" fill="#10A957"/>
    <text x="0" y="93" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="300" fill="#6B8EA8" letter-spacing="-2">techstars</text>
  </g>
</svg>
